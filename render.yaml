services:
  - type: web
    name: socks-warehouse-service
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: socks-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: socks-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: socks-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: socks-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: socks-db
          property: password

databases:
  - name: socks-db
    plan: free
    databaseName: socks_db
    user: socks
